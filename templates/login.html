{% extends "base.html" %}

{% block title %}Login - Smart Trip Planner{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Sign in to access your saved trips and personalized plans</p>
            </div>

            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input 
                        type="email" 
                        name="email" 
                        id="loginEmail" 
                        class="form-control form-control-simple" 
                        placeholder="you@example.com" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input 
                        type="password" 
                        name="password" 
                        id="loginPassword" 
                        class="form-control form-control-simple" 
                        placeholder="••••••••" 
                        required
                    >
                </div>

                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%;" id="loginSubmitBtn">
                        Sign In
                    </button>
                </div>
            </form>

            <div class="auth-footer">
                Don't have an account? 
                <a href="{{ url_for('register') }}" style="font-weight: 600;">Create one now</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
